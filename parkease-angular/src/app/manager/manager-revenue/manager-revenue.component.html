<div class="container py-4">

  <!-- Loading state -->
  <div class="loading-wrapper" *ngIf="loading">
    <div class="spinner-border spinner-border-sm text-dark"></div>
    Loading revenue data...
  </div>

  <!-- Error state -->
  <div *ngIf="!loading && error"
       class="alert alert-danger d-flex align-items-center" role="alert">
    <span>{{error}}</span>
  </div>

  <div *ngIf="!loading && !error">

    <div class="page-header">
      <h2>Revenue Overview</h2>
    </div>

    <div *ngIf="lotRevenues.length===0" class="empty-state">
      <mat-icon class="empty-icon" style="font-size:3rem; width:3rem; height:3rem; color:#ccc;">payments</mat-icon>
      <h4>No revenue data</h4>
      <p>Revenue will appear once your lots have bookings.</p>
    </div>

    <div *ngIf="lotRevenues.length>0">
      <div class="row g-3 mb-4">
        <div class="col-md-4" *ngFor="let lr of lotRevenues">
          <div class="data-card">
            <div class="data-card-label mb-1">{{lr.lot.name}}</div>
            <div style="font-size:0.78rem; color:#aaa; margin-bottom:8px;">{{lr.lot.city}}</div>
            <div class="data-card-number">Rs.{{lr.revenue | number:'1.2-2'}}</div>
            <div class="data-card-label">Total Revenue</div>
          </div>
        </div>
      </div>

      <div class="data-card text-center">
        <div class="data-card-label mb-2">Total Revenue Across All Lots</div>
        <div style="font-size:2.8rem; font-weight:700; color:#000; letter-spacing:-1px;">
          Rs.{{totalRevenue | number:'1.2-2'}}
        </div>
      </div>
    </div>

  </div>
</div>
