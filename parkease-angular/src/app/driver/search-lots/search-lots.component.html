<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="page-header text-center" style="border:none; padding-bottom:0;">
        <h2>Find Nearby Parking</h2>
        <p class="text-muted" style="font-size:0.9rem;">
          Use your location or enter coordinates manually
        </p>
      </div>

      <div class="feature-card mt-4">

        <button class="btn btn-dark-primary w-100 mb-4"
                (click)="useMyLocation()" [disabled]="locating">
          <mat-icon style="vertical-align:middle; margin-right:4px;">location_on</mat-icon>
          {{ locating ? 'Getting location...' : 'Use My Current Location' }}
        </button>

        <div class="text-center text-muted mb-4" style="font-size:0.85rem;">— or enter manually —</div>

        <div class="mb-3">
          <label>Latitude</label>
          <input type="number" step="0.0001" class="form-control"
                 [(ngModel)]="lat" placeholder="e.g. 28.5706">
        </div>

        <div class="mb-3">
          <label>Longitude</label>
          <input type="number" step="0.0001" class="form-control"
                 [(ngModel)]="lng" placeholder="e.g. 77.3272">
        </div>

        <div class="mb-4">
          <label>Search Radius</label>
          <select class="form-select" [(ngModel)]="radius">
            <option value="1">1 km</option>
            <option value="2">2 km</option>
            <option value="5">5 km</option>
            <option value="10">10 km</option>
          </select>
        </div>

        <div class="alert alert-danger py-2" *ngIf="locationError">{{locationError}}</div>

        <button class="btn btn-dark-primary w-100"
                (click)="onSearch()" [disabled]="!lat || !lng">
          Search Parking Lots
        </button>

      </div>
    </div>
  </div>
</div>
