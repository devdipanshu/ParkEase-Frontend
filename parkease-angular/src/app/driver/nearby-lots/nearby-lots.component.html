<div class="container py-4">

  <!-- Loading state -->
  <div class="loading-wrapper" *ngIf="loading">
    <div class="spinner-border spinner-border-sm text-dark"></div>
    Searching nearby lots...
  </div>

  <!-- Error state -->
  <div *ngIf="!loading && errorMsg"
       class="alert alert-danger d-flex align-items-center" role="alert">
    <span>{{errorMsg}}</span>
  </div>

  <div *ngIf="!loading && !errorMsg">

    <div class="page-header">
      <h2>Nearby Parking Lots</h2>
    </div>

    <div *ngIf="lots.length === 0" class="empty-state">
      <mat-icon class="empty-icon" style="font-size:3rem; width:3rem; height:3rem; color:#ccc;">local_parking</mat-icon>
      <h4>No parking lots found</h4>
      <p>Try increasing the search radius.</p>
      <a routerLink="/driver/search-lots"
         class="btn btn-dark-primary btn-sm mt-2">
        Search Again
      </a>
    </div>

    <div class="row g-3" *ngIf="lots.length > 0">
      <div class="col-md-4" *ngFor="let lot of lots">
        <div class="feature-card h-100 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="mb-0">{{lot.name}}</h5>
            <span class="status-badge"
              [class.badge-active]="lot.isOpen"
              [class.badge-cancelled]="!lot.isOpen">
              {{lot.isOpen ? 'Open' : 'Closed'}}
            </span>
          </div>
          <p class="text-muted mb-3" style="font-size:0.83rem;">{{lot.address}}, {{lot.city}}</p>
          <div class="d-flex gap-4 mb-3">
            <div>
              <div style="font-weight:700; font-size:1.2rem;">{{lot.availableSpots}}</div>
              <div style="font-size:0.78rem; color:#888;">Available</div>
            </div>
            <div>
              <div style="font-weight:700; font-size:1.2rem;">{{lot.totalSpots}}</div>
              <div style="font-size:0.78rem; color:#888;">Total</div>
            </div>
          </div>
          <a [routerLink]="['/driver/lot', lot.lotId]"
             class="btn btn-dark-primary btn-sm mt-auto">
            View &amp; Book
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
