<nav class="navbar navbar-expand-lg bg-white sticky-top">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-1" routerLink="/">
      <mat-icon style="font-size:1.4rem; width:1.4rem; height:1.4rem; color:#000;">local_parking</mat-icon>
      <span>ParkEase</span>
    </a>

    <!-- Toggler mobile -->
    <button class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">

        <!-- DRIVER nav -->
        <ng-container *ngIf="(role$ | async) === 'DRIVER'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/driver/dashboard"
               routerLinkActive="fw-semibold text-black">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/driver/search-lots"
               routerLinkActive="fw-semibold text-black">Find Parking</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/driver/my-bookings"
               routerLinkActive="fw-semibold text-black">My Bookings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/driver/my-vehicles"
               routerLinkActive="fw-semibold text-black">Vehicles</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/driver/payments"
               routerLinkActive="fw-semibold text-black">Payments</a>
          </li>
        </ng-container>

        <!-- MANAGER nav -->
        <ng-container *ngIf="(role$ | async) === 'MANAGER'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/manager/dashboard"
               routerLinkActive="fw-semibold text-black">My Lots</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/manager/create-lot"
               routerLinkActive="fw-semibold text-black">Add Lot</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/manager/revenue"
               routerLinkActive="fw-semibold text-black">Revenue</a>
          </li>
        </ng-container>

        <!-- ADMIN nav -->
        <ng-container *ngIf="(role$ | async) === 'ADMIN'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/dashboard"
               routerLinkActive="fw-semibold text-black">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/manage-lots"
               routerLinkActive="fw-semibold text-black">Manage Lots</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/analytics"
               routerLinkActive="fw-semibold text-black">Analytics</a>
          </li>
        </ng-container>

      </ul>

      <!-- Right side -->
      <ul class="navbar-nav ms-auto align-items-center gap-2">

        <!-- Notification bell (DRIVER only) -->
        <li class="nav-item" *ngIf="(role$ | async) === 'DRIVER'">
          <a class="nav-link position-relative" routerLink="/driver/notifications">
            <mat-icon>notification_important</mat-icon>
            <span *ngIf="unreadCount > 0"
                  class="position-absolute top-0 start-100
                         translate-middle badge rounded-pill bg-dark"
                  style="font-size:0.6rem;">
              {{unreadCount}}
            </span>
          </a>
        </li>

        <!-- Profile link -->
        <li class="nav-item" *ngIf="loggedIn$ | async">
          <a class="nav-link d-flex align-items-center gap-1"
             routerLink="/profile"
             routerLinkActive="fw-semibold text-black"
             style="font-size:0.88rem;">
            <mat-icon style="font-size:1.1rem; width:1.1rem; height:1.1rem;">person</mat-icon>
            {{displayName}}
          </a>
        </li>

        <li class="nav-item" *ngIf="loggedIn$ | async">
          <button class="btn btn-dark-primary btn-sm px-3 py-2" (click)="logout()">
            Logout
          </button>
        </li>

        <li class="nav-item" *ngIf="!(loggedIn$ | async)">
          <a routerLink="/login" class="btn btn-dark-primary btn-sm px-3 py-2">Sign In</a>
        </li>

      </ul>
    </div>
  </div>
</nav>
